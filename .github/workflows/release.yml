name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build exe + instalador
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar PyInstaller y dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r requirements.txt

      - name: Compilar con PyInstaller (onedir)
        run: python -m PyInstaller KioscoPOS.spec --noconfirm

      - name: Instalar Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Compilar instalador con la versión del tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppVersion=$version installer\KioscoPOS.iss

      - name: Empaquetar carpeta onedir (portable)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path dist\KioscoPOS\* -DestinationPath "dist\KioscoPOS-$version.zip"

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SetupKioscoPOS*.exe
            dist/KioscoPOS-*.zip
          generate_release_notes: true