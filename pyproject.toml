[project]
name = "kiosco-pos"
version = "1.2.0"
description = "Punto de venta de escritorio (POS) para kioscos, offline-first, con arquitectura en capas y CQRS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "SQLAlchemy>=2.0,<3",
    "pypdf>=4.0",
    "pocketbase>=0.17,<1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
kiosco-pos = "app.main:entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]